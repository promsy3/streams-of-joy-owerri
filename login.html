<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Streams of Joy</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 2rem;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <h2><i class="ti ti-lock"></i> Media Admin</h2>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter admin password" required>
                </div>
                <div id="login-error" style="color: var(--danger-color); margin-bottom: 1rem; display: none;">
                    Incorrect password.
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <div style="margin-top: 1.5rem;">
                <a href="index.html" style="font-size: 0.9rem; color: var(--text-secondary);"><i class="ti ti-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
